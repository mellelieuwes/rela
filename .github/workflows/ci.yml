name: CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on pull_request, deliberately. The filter matches the
  # TARGET branch, so a stacked PR (one opened against another feature branch
  # rather than develop) matched nothing and ran ZERO checks — while the PR page
  # showed no failures, which reads identically to "everything passed". A
  # security-relevant endpoint was reviewed that way before this was caught.
  # Every PR gets CI regardless of what it targets.
  pull_request:
  # Required for the merge queue: entries are tested on an ephemeral
  # `gh-readonly-queue/...` ref, and a required check that never runs there
  # leaves the entry queued forever. Every check listed as required on
  # develop must therefore also report on merge_group.
  merge_group:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    # 26.04, not ubuntu-latest: the command sandbox needs unprivileged user
    # namespaces, which 24.04 restricts via AppArmor
    # (apparmor_restrict_unprivileged_userns=1, seen as bwrap "Failed
    # RTM_NEWADDR: Operation not permitted"). 26.04 does not ship that
    # restriction, so bwrap works without any sysctl override.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          # The two Go caches are split deliberately, because they have
          # different sharing properties.
          #
          # MODULE cache (~/go/pkg/mod): byte-identical in every job, since it
          # is a function of go.sum alone. setup-go keys on exactly that, so
          # one shared entry is correct and 15 copies would be waste. Jobs do
          # race to save it and losers log "Unable to reserve cache" — harmless
          # here, because whichever job wins stored the same bytes.
          #
          # BUILD cache (~/.cache/go-build): differs per job, because each
          # compiles a different package set under different build tags. That
          # one gets a per-job key below. Sharing it was the original defect:
          # every job derived the same go.sum key, raced, and the winner stored
          # only its own partial build graph — entries under one key ranged
          # 10MB to 791MB, so a job could restore a cache near-useless to it.
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          # A go.sum bump falls back to the previous build cache rather than
          # going cold. Safe: Go's cache is content-addressed, so stale entries
          # are never served for changed inputs, only ignored.
          restore-keys: |
            go-test-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-

      - name: Download dependencies
        run: go mod download

      # External commands (attachment scan/transform, view export) run confined
      # and FAIL CLOSED when no sandbox is available, so the runner needs
      # bubblewrap or every command-running test fails. Installing it also means
      # CI exercises the real sandbox — including the negative tests that assert
      # egress and out-of-allowlist reads are actually blocked, which otherwise
      # skip and would let a broken profile ship unnoticed.
      - name: Install bubblewrap (command sandbox) and Wails deps
        # GTK4 + WebKitGTK headers are needed to build cmd/rela-desktop, which
        # links Wails v3; without them the package fails to build on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify the sandbox actually works on this runner
        # A hard failure here is better than every sandbox test silently
        # skipping: it means the confinement CI thinks it is testing is absent.
        run: bwrap --unshare-all --ro-bind / / /bin/true

      - name: Run tests
        # -shuffle=on randomizes test order to surface inter-test ordering
        # dependencies; the seed is printed on failure for reproduction.
        run: go test -v -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2.19.0
        with:
          config: .testcoverage.yml
          github-action-output: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  # Reachability floor (report-only). Merges coverage from unit + cross-package
  # (-coverpkg) and reports the number via scupper. This is NOT a required check
  # and does NOT fail the build — it establishes the honest baseline before a
  # rising floor is introduced. e2e/postgres legs are opt-in (RUN_E2E /
  # RELA_TEST_DATABASE_URL) and omitted here to keep the job fast.
  reachability:
    name: Reachability (report-only)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-reachability-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-reachability-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-

      - name: Download dependencies
        run: go mod download

      # bubblewrap for the command sandbox; GTK4 + WebKitGTK because the
      # coverage run builds cmd/rela-desktop, which links Wails v3.
      - name: Install bubblewrap (command sandbox) and Wails deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Measure reachability (report-only, no threshold)
        run: ./scripts/reachability.sh

      - name: Upload reachability profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reachability-report
          path: reachability.out

  clamav:
    name: ClamAV Integration
    # 26.04 for the same reason as the Test job: the command sandbox needs
    # unprivileged user namespaces, which 24.04 restricts via AppArmor.
    runs-on: ubuntu-26.04
    # Blocking, but only where it can regress. Every other scan test substitutes
    # a stub `sh -c` command, so nothing in the suite observes that clamdscan
    # needs its config bound into the sandbox — TKT-ZP1EE3 shipped a broken
    # documented recipe with a fully green CI. Running this on every PR would
    # charge each one a ~300 MB signature download for code it cannot touch, so
    # it is path-filtered instead of scheduled: a PR that touches the sandbox,
    # attachments or the guide cannot merge with this red, and one that doesn't
    # pays nothing. (Scheduled would be cheaper still, but a non-blocking result
    # nobody reads is not a guarantee.)
    #
    # The detection lives in a STEP rather than a job-level `if`, so the job
    # always reports a status — a required check that never runs leaves a
    # merge-queue entry queued forever.
    steps:
      - uses: actions/checkout@v7
        with:
          # 0, not a shallow depth: the detection below diffs against the PR
          # base with `BASE_SHA...HEAD`, which needs the merge base in the
          # local clone. A shallow clone usually lacks it, and `git diff` then
          # fails INSIDE an `if` condition, where `set -e` does not fire — the
          # step would quietly write changed=false and report a green skip on
          # every PR forever. Same reason the ticket-hygiene job uses 0.
          fetch-depth: 0

      - name: Detect sandbox / attachment changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — running clamav integration."
            exit 0
          fi
          # Compute the diff in its own statement so a git failure is fatal
          # rather than being swallowed by the surrounding `if`.
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            internal/cmdexec internal/attachment \
            docs-project/entities/guides/GUIDE-attachment-security.md \
            docs/attachment-security.md \
            scripts/clamav-vm-test.sh)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sandbox/attachment code changed — running clamav integration:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sandbox/attachment changes — skipping."
          fi

      - name: Set up Go
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-clamav-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-clamav-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-

      - name: Install bubblewrap and ClamAV
        if: steps.detect.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap clamav-daemon

      - name: Verify the sandbox actually works on this runner
        # Without a working sandbox the integration test would pass vacuously:
        # --fdpass only fails BECAUSE of the namespace boundary.
        if: steps.detect.outputs.changed == 'true'
        run: bwrap --unshare-all --ro-bind / / /bin/true

      - name: Cache ClamAV signature databases
        if: steps.detect.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: /var/lib/clamav
          # The key is unique per run so the cache is always REFRESHED with
          # whatever freshclam left behind, while restore-keys means a run
          # starts from the most recent databases and usually skips the ~300 MB
          # download. Staleness is fine here: the test asserts the EICAR
          # verdict, which every database version has detected for decades.
          key: clamav-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clamav-db-${{ runner.os }}-

      - name: Start clamd
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # freshclam runs on a timer AND as a daemon on Ubuntu; both hold a
          # lock on /var/lib/clamav that makes a manual run fail. Stop both.
          sudo systemctl stop clamav-freshclam.service clamav-freshclam.timer 2>/dev/null || true

          # Ownership first: the cache restores /var/lib/clamav as the runner
          # user, and freshclam drops privileges to `clamav`, so a restored
          # cache is unwritable until this runs.
          sudo mkdir -p /var/lib/clamav
          sudo chown -R clamav:clamav /var/lib/clamav

          # clamd refuses to start with no signature databases. NOT --quiet:
          # when this fails it is the only evidence of why.
          #
          # BOTH main and daily must be present: clamav-daemon.service carries a
          # ConditionPathExistsGlob for each, so a cache holding only one leaves
          # systemd skipping the unit ("start condition unmet") and the socket
          # never appears. Checking only daily made that state self-perpetuating
          # — the incomplete cache satisfied the check, skipped the download, and
          # was then saved forward under a fresh key for the next run to restore.
          if ! ls /var/lib/clamav/main.c[vl]d >/dev/null 2>&1 \
            || ! ls /var/lib/clamav/daily.c[vl]d >/dev/null 2>&1; then
            echo "Signature database incomplete — downloading (~300 MB)."
            ls -la /var/lib/clamav/ || true
            sudo -u clamav freshclam --stdout
          else
            echo "Signature database restored from cache:"
            ls -la /var/lib/clamav/
          fi

          sudo systemctl restart clamav-daemon

          # clamd parses the whole database set before it binds the socket, so
          # this legitimately takes tens of seconds on a cold start.
          for _ in $(seq 1 90); do
            if [ -S /var/run/clamav/clamd.ctl ]; then
              echo "clamd socket is up."
              exit 0
            fi
            sleep 2
          done

          echo "::error::clamd socket never appeared at /var/run/clamav/clamd.ctl"
          sudo systemctl status clamav-daemon --no-pager --full || true
          sudo journalctl -u clamav-daemon --no-pager -n 100 || true
          exit 1

      - name: Run clamd integration tests
        if: steps.detect.outputs.changed == 'true'
        env:
          RELA_TEST_CLAMD: '1'
        run: go test -race -run 'TestClamd' -v ./internal/attachment/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: "v2.11.4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache golangci-lint
        id: cache-golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: tool-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}

      - name: Install golangci-lint
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        # Build from source against the active Go toolchain so the linter can
        # analyse our code regardless of the go.mod toolchain directive.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      # rela-desktop links Wails v3, whose Linux build needs GTK4 + WebKitGTK
      # headers. Without them the cgo packages fail to build.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Run golangci-lint
        run: golangci-lint run ./...

  arch-lint:
    name: Architecture
    runs-on: ubuntu-latest
    env:
      GO_ARCH_LINT_VERSION: "v1.15.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-arch-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-arch-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache go-arch-lint
        id: cache-go-arch-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/go-arch-lint
          key: tool-go-arch-lint-${{ env.GO_ARCH_LINT_VERSION }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}

      - name: Install go-arch-lint
        if: steps.cache-go-arch-lint.outputs.cache-hit != 'true'
        # Keep in sync with go_arch_lint_version in the justfile.
        run: go install github.com/fe3dback/go-arch-lint@${{ env.GO_ARCH_LINT_VERSION }}

      - name: Check architecture
        run: go-arch-lint check

  plimsoll:
    name: God-object lint
    runs-on: ubuntu-latest
    env:
      PLIMSOLL_VERSION: "v0.2.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-plimsoll-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-plimsoll-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      # rela-desktop links Wails v3, whose Linux build needs GTK4 + WebKitGTK
      # headers to type-check. Without them the cgo packages fail to load and
      # the analysis silently degrades to "skipped due to errors in package".
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Cache plimsoll
        id: cache-plimsoll
        uses: actions/cache@v6
        with:
          path: ~/go/bin/plimsoll
          key: tool-plimsoll-${{ env.PLIMSOLL_VERSION }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}

      - name: Install plimsoll
        if: steps.cache-plimsoll.outputs.cache-hit != 'true'
        # Keep in sync with plimsoll_version in the justfile.
        run: go install github.com/sourcehaven-bv/plimsoll/cmd/plimsoll@${{ env.PLIMSOLL_VERSION }}

      - name: Check type load lines
        run: plimsoll ./...

  comment-lint:
    name: Comment lint
    runs-on: ubuntu-latest
    env:
      COMMENTLINT_VERSION: "v0.3.1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-comment-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-comment-lint-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache commentlint
        id: cache-commentlint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/commentlint
          key: tool-commentlint-${{ env.COMMENTLINT_VERSION }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}

      - name: Install commentlint
        if: steps.cache-commentlint.outputs.cache-hit != 'true'
        # Keep in sync with commentlint_version in the justfile.
        run: go install github.com/sourcehaven-bv/commentlint@${{ env.COMMENTLINT_VERSION }}

      # Gate: clean today, so a regression fails the build. Rules are promoted
      # here from the advisory step once their backlog reaches zero.
      - name: Check comments (gate)
        run: commentlint -rules commented-code,doclink ./internal ./cmd

      # Advisory: real findings with a backlog being worked down. Visible in
      # the log, never red — see .commentlint.yml for why each rule is here.
      #
      # One invocation PER RULE, deliberately: the cross-comment rules
      # (duplication, nil-contract, doclink, param-contract) each have their
      # own output shape and replace the per-comment output rather than adding
      # to it, so a single run would silently report only one of them.
      - name: Comment report (advisory)
        continue-on-error: true
        run: |
          for rule in restatement param-contract nil-contract duplication; do
            echo "::group::commentlint $rule"
            commentlint -rules "$rule" -rank -top 30 ./internal ./cmd || true
            echo "::endgroup::"
          done

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    # Static security analysis for the frontend: gosec (see .golangci.yml)
    # covers Go, this covers JS/TS. frontend/ renders user-authored markdown
    # to HTML, so XSS is the risk that matters most here.
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@v7

      - name: Scan frontend
        # Rules are local (.semgrep/), not registry packs: the OSS packs
        # (p/xss, p/javascript, p/typescript, p/owasp-top-ten) contain no
        # browser DOM-XSS rules and find nothing here — see the header of the
        # rule file. --error makes a finding fail the job; new findings should
        # be fixed or given an inline `nosemgrep: <rule-id>` comment stating
        # why, never silenced wholesale.
        run: |
          semgrep scan \
            --config=.semgrep/frontend-xss.yml \
            --error \
            --metrics=off \
            --exclude='*.test.ts' \
            --exclude='*.spec.ts' \
            frontend/src e2e

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

      - name: Check audit-log retention docs (>= 12 months; issue #887)
        run: ./scripts/check-audit-retention-docs.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # RELA_FULL_CORPUS sweeps every entity body through the markdown
        # editor's parse/serialize pair instead of the 1-in-8 sample the local
        # run uses. It is the gate on the WYSIWYG editor never rewriting what
        # a user did not edit, and it takes about a minute.
        run: RELA_FULL_CORPUS=1 npm run test:run

      - name: Build
        run: npm run build

      - name: Work tree clean after build
        # Whole-repo tripwire: fails when any step of this job modified
        # tracked files or left untracked files behind (e.g. the vue-tsc
        # artifacts that once shadowed vite.config.ts, BUG-P0DZA5).
        run: |
          DIRTY=$(git status --porcelain --untracked-files=all)
          if [ -n "$DIRTY" ]; then
            echo "Repo not clean after build:"
            echo "$DIRTY"
            exit 1
          fi

  e2e:
    name: E2E
    # 26.04, not ubuntu-latest — same reason as the `test` job above: the
    # command sandbox needs unprivileged user namespaces, which earlier images
    # restrict via AppArmor. This job only started needing a working sandbox
    # when document `command:` renderers moved off `sh -c` onto cmdexec
    # (TKT-QGHNVA), which fails closed rather than running unconfined.
    runs-on: ubuntu-26.04
    # A postgres service backs the pgstore-only e2e specs (relation/entity
    # content history). The default fsstore specs ignore it; the postgres specs
    # skip when RELA_E2E_DATABASE_URL is unset, so this is what turns them on.
    env:
      RELA_E2E_DATABASE_URL: postgres://rela@127.0.0.1:5432/rela_e2e?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rela
          POSTGRES_DB: rela_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-e2e-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-e2e-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # Document `command:` renderers run confined via internal/cmdexec, which
      # FAILS CLOSED when no sandbox is available (TKT-QGHNVA moved them off
      # `sh -c`). Without bubblewrap the fixture documents never render and the
      # document specs fail. Same rationale as the `test` job above.
      - name: Install bubblewrap (command sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build rela-server (embeds E2E dev-mode frontend)
        # build:e2e produces a development-mode bundle (import.meta.env.DEV
        # === true) so DEV-guarded test hooks compile in for the E2E suite.
        # Release builds use the production `build`, which strips them (#890).
        # Also build the postgres-tagged server for the pgstore-only specs (the
        # fixture forbids in-fixture builds under CI, so both must exist here).
        run: |
          cd frontend && npm run build:e2e && cd ..
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/rela-server ./cmd/rela-server
          CGO_ENABLED=0 go build -tags postgres -trimpath -ldflags "-s -w" -o bin/rela-server-postgres ./cmd/rela-server

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Lint e2e (Page Object Pattern enforcement)
        working-directory: e2e
        run: npm run lint

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        # Short sweep cadence so the postgres relation-history spec sees
        # create/update version captures within seconds instead of the 5-minute
        # production default. Ignored by the fsstore specs.
        env:
          RELA_VERSION_SWEEP_INTERVAL: 500ms
          RELA_VERSION_SWEEP_IDLE: 150ms
          RELA_VERSION_SWEEP_MAX_STALENESS: 2s
        run: npx playwright test --reporter=line

      # The worlds manual is EXECUTABLE — its shows{}/page{}/api{} islands assert
      # the prose against a running rela — but it was built only by the opt-in
      # `just docs-visual-postgres`, never in CI. So the document that says "every
      # claim below is checked" could rot silently, and did: a section described
      # neighbour resolution the software does not do (QA F-6a).
      #
      # It runs HERE rather than in the docs job because this is the only job
      # with all four things a build needs: Chrome (installed above for
      # Playwright), a built frontend, postgres (screenshot{} of the history
      # view needs a backend that versions), and bubblewrap for confined
      # `command:` renderers.
      #
      # The sweep overrides match the E2E ones and for the same reason: version
      # capture is debounced 5 minutes in production, far longer than a build.
      - name: Build the worlds manual (executable doc assertions)
        env:
          RELA_DATABASE_URL: postgres://rela@127.0.0.1:5432/rela_e2e?sslmode=disable
          RELA_VERSION_SWEEP_INTERVAL: 500ms
          RELA_VERSION_SWEEP_IDLE: 150ms
          RELA_VERSION_SWEEP_MAX_STALENESS: 2s
        run: |
          go build -tags postgres -o bin/rela-docs-postgres ./cmd/rela-docs
          ./bin/rela-docs-postgres build prototypes/worlds/manual/worlds-manual.md \
            --project prototypes/worlds/project \
            --out "$RUNNER_TEMP/worlds-manual.md"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-fuzz-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-fuzz-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Run fuzz tests
        run: |
          # Run one fuzz target, failing ONLY on a real finding.
          #
          # Since Go 1.25, a `-fuzztime` budget that expires while a worker is
          # mid-execution exits non-zero with "context deadline exceeded"
          # instead of stopping cleanly. That is the timer doing its job, not a
          # bug in the code under test — but GitHub's default `bash -e` treats
          # it as a step failure, which made this job flake on slow runners
          # (observed twice in one afternoon on two different targets, at ~14k
          # execs/sec versus ~160k locally) and skip every target after the
          # first.
          #
          # Swallowing the timeout is only safe because a genuine finding leaves
          # different, unambiguous evidence: the target writes a reproducer
          # under testdata/fuzz/ and prints "Failing input written to". We fail
          # hard whenever that appears, so a real crash still breaks the build.
          #
          # Do NOT widen that grep to "--- FAIL": the timeout output contains
          # `--- FAIL: <target>` AND "context deadline exceeded" together, so
          # matching on it would re-fail exactly the case this exists to
          # tolerate. Order matters for the same reason — the crash check is a
          # positive match on reproducer evidence, not on generic failure.
          run_fuzz() {
            local target=$1 pkg=$2 out status
            echo "==> fuzzing $target in $pkg"
            set +e
            out=$(go test -run='^$' -fuzz="^${target}\$" -fuzztime=10s "$pkg" 2>&1)
            status=$?
            set -e
            echo "$out"
            if [ $status -eq 0 ]; then
              return 0
            fi
            if grep -q 'Failing input written to' <<<"$out"; then
              echo "::error::fuzz target $target found a failing input"
              return 1
            fi
            if grep -q 'context deadline exceeded' <<<"$out"; then
              echo "::notice::$target hit its time budget without a finding (slow runner); treating as pass"
              return 0
            fi
            echo "::error::fuzz target $target failed for an unrecognised reason (exit $status)"
            return 1
          }

          run_fuzz FuzzParseDocument ./internal/markdown/
          run_fuzz FuzzParseEntityID ./internal/entity/
          run_fuzz FuzzValidateID ./internal/entity/

  postgres:
    name: Postgres Backend
    runs-on: ubuntu-latest
    # The CI database is ephemeral and reachable only from this job's runner —
    # it holds no real data and is torn down with the runner. There is no
    # credential to protect, so the container uses trust auth (no password)
    # rather than a secret. This lets the job run everywhere, including
    # Dependabot and fork PRs where GitHub does not expose repository secrets
    # (a secret-sourced password resolved to empty there and the container
    # failed to start, failing CI on every dependency bump).
    env:
      POSTGRES_USER: rela
      POSTGRES_DB: rela_test
      # This job's entire purpose is proving the postgres backend matches the
      # default one, and the pgstore suite SKIPS itself when the DSN is absent
      # — a skip that is indistinguishable from a pass in the exit code and the
      # CI summary. Without this, a dropped env var or a renamed service
      # container silently turns the backend-parity gate into a no-op and
      # nothing goes red. Setting it makes the suite hard-fail instead of
      # skipping (see requireDBEnv in internal/store/pgstore/testdb_test.go).
      RELA_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rela
          POSTGRES_DB: rela_test
          # Throwaway, runner-local DB: no password, trust auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Wait for the server to accept connections before tests run.
        options: >-
          --health-cmd "pg_isready -U rela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-postgres-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-postgres-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      # Trust auth: no password in the DSN. The DB is ephemeral and
      # runner-local, so there is no credential to keep out of the log.
      - name: Configure test database URL
        run: |
          printf 'RELA_TEST_DATABASE_URL=postgres://%s@127.0.0.1:5432/%s?sslmode=disable\n' \
            "$POSTGRES_USER" "$POSTGRES_DB" >> "$GITHUB_ENV"

      # The default build must NOT link pgx, and the postgres build must NOT
      # link bleve. These greps are the load-bearing assertions for the
      # "no bleve in the postgres build" acceptance criterion (TKT-M8400).
      - name: Assert dependency isolation
        run: |
          set -euo pipefail
          echo "default build must not link pgx:"
          ! go list -deps ./cmd/rela-server | grep -q 'jackc/pgx'
          ! go list -deps ./cmd/rela        | grep -q 'jackc/pgx'
          echo "postgres build must not link bleve:"
          ! go list -deps -tags postgres ./cmd/rela-server | grep -q 'blevesearch/bleve'
          ! go list -deps -tags postgres ./cmd/rela        | grep -q 'blevesearch/bleve'
          echo "only rela-docs links chromedp (screenshot{} browser capture):"
          ! go list -deps ./cmd/rela        | grep -q 'chromedp/chromedp'
          ! go list -deps ./cmd/rela-server | grep -q 'chromedp/chromedp'
          ! go list -deps -tags postgres ./cmd/rela        | grep -q 'chromedp/chromedp'
          ! go list -deps -tags postgres ./cmd/rela-server | grep -q 'chromedp/chromedp'
          echo "both rela-docs builds link it: screenshot{} is supported on either backend,"
          echo "and history figures REQUIRE postgres (versioning is a pg-only capability)."
          # POSITIVE assertions use grep WITHOUT -q: `grep -q` exits on the first
          # match, which SIGPIPEs a `go list` that is still writing, and pipefail
          # turns that into exit 141. It only bites when `go list` is slow enough
          # to still be producing output — i.e. when it is downloading modules —
          # so the negated assertions above are unaffected (no match means grep
          # reads to EOF) and this one fails only on a cold module cache.
          go list -deps ./cmd/rela-docs                    | grep 'chromedp/chromedp' >/dev/null
          go list -deps -tags postgres ./cmd/rela-docs     | grep 'chromedp/chromedp' >/dev/null
          echo "no build but the sqlite one links the sqlite driver:"
          ! go list -deps ./cmd/rela-server                | grep -q 'modernc.org/sqlite'
          ! go list -deps ./cmd/rela                       | grep -q 'modernc.org/sqlite'
          ! go list -deps -tags postgres ./cmd/rela-server | grep -q 'modernc.org/sqlite'
          ! go list -deps -tags postgres ./cmd/rela        | grep -q 'modernc.org/sqlite'
          echo "the sqlite build must NOT link pgx:"
          ! go list -deps -tags sqlite ./cmd/rela-server | grep -q 'jackc/pgx'
          ! go list -deps -tags sqlite ./cmd/rela        | grep -q 'jackc/pgx'
          echo "the sqlite build DOES link bleve and the sqlite driver (it uses both):"
          go list -deps -tags sqlite ./cmd/rela-server | grep 'blevesearch/bleve' >/dev/null
          go list -deps -tags sqlite ./cmd/rela-server | grep 'modernc.org/sqlite' >/dev/null
          echo "the sqlite rela-docs links it too: appbuild.At pins the temp project's"
          echo "root, so a seed can no longer escape into a real database (TKT-SK2QQW)."
          go list -deps -tags sqlite ./cmd/rela-docs | grep 'chromedp/chromedp' >/dev/null
          echo "rela-desktop links the default backend only:"
          ! go list -deps ./cmd/rela-desktop | grep -q 'jackc/pgx'
          ! go list -deps ./cmd/rela-desktop | grep -q 'modernc.org/sqlite'
          echo "OK: backends and the browser dependency are isolated."

      # Backend tags are mutually exclusive by construction: each recipe
      # declares New, so two at once is a redeclaration error. That is the
      # mechanism keeping "which backend am I running" unambiguous, and it is
      # only load-bearing if it is pinned — narrowing a tag to "fix" a
      # redeclaration would silently let one recipe win instead.
      - name: Assert conflicting backend tags fail loudly
        run: |
          set -euo pipefail
          ! go build -tags sqlite,postgres      ./internal/appbuild/ 2>/dev/null
          ! go build -tags sqlite,memorybackend ./internal/appbuild/ 2>/dev/null
          ! go build -tags postgres,memorybackend ./internal/appbuild/ 2>/dev/null
          echo "OK: conflicting backend tags are rejected at compile time."

      # cmd/rela-desktop links Wails v3, whose Linux build needs GTK4 +
      # WebKitGTK headers. `go build ./...` covers it in every tag combination
      # below, so the headers are needed even though this job is about postgres.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Compile all backend build-tag combinations
        run: |
          go build ./...
          go build -tags sqlite ./...
          go build -tags memorybackend ./...
          go build -tags postgres ./...

      # RELA_TEST_DATABASE_REQUIRED (job env) makes the suite hard-fail rather
      # than skip if the DSN is missing. The grep below is the second, blunter
      # half of the same guard: it catches a suite that skipped for any OTHER
      # reason — a future build tag, a t.Skip added inside a subtest, a
      # conformance case quietly excluded — which the env var alone would not
      # notice. Both are cheap; the failure they prevent (silent backend
      # divergence) is not.
      - name: Run pgstore conformance + fuzz seeds (race) against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -tags postgres -v ./internal/store/pgstore/... 2>&1 | tee pgstore-test.log
          if grep -q -- '--- SKIP' pgstore-test.log; then
            echo "::error::pgstore tests SKIPPED in the Postgres Backend job."
            echo "This job exists to prove backend parity; a skipped suite is not a pass."
            grep -- '--- SKIP' pgstore-test.log
            exit 1
          fi
          echo "OK: pgstore suite ran against PostgreSQL with no skips."

      # The job-queue conformance suite is DB-gated the same way, and the same
      # argument applies: a memory-only run cannot see backend divergence, and
      # one such bug already shipped (a NUL byte in the idempotency fingerprint
      # that Go and the memory backend accept and PostgreSQL rejects outright).
      # `just test-postgres` has always included this package; CI did not, so
      # the durable tier was unpinned here despite the local recipe covering it.
      - name: Run job-queue conformance (race) against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -tags postgres -v ./internal/jobs/... 2>&1 | tee jobs-test.log
          if grep -q -- '--- SKIP' jobs-test.log; then
            echo "::error::job-queue tests SKIPPED in the Postgres Backend job."
            echo "A skipped conformance suite is not a pass."
            grep -- '--- SKIP' jobs-test.log
            exit 1
          fi
          echo "OK: job-queue suite ran against PostgreSQL with no skips."

      # The comment-backend conformance suite is DB-gated on the same terms.
      # Note it needs NO build tag: pgcomments takes an injected handle and is
      # an ordinary package, so `go test` compiles it in every build. Only the
      # DSN decides whether it runs, which is exactly why it needs this step —
      # the untagged CI job compiles it and skips every meaningful test.
      - name: Run comment-backend conformance (race) against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -v ./internal/comments/... 2>&1 | tee comments-test.log
          if grep -q -- '--- SKIP' comments-test.log; then
            echo "::error::comment-backend tests SKIPPED in the Postgres Backend job."
            echo "This suite is the file-vs-database parity gate; a skip is not a pass."
            grep -- '--- SKIP' comments-test.log
            exit 1
          fi
          echo "OK: comment backends ran against PostgreSQL with no skips."

      # Scheduler run-state conformance, DB-gated on the same terms and, like
      # pgcomments, untagged.
      - name: Run scheduler run-state conformance (race) against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -v ./internal/schedulerstate/... 2>&1 | tee schedstate-test.log
          if grep -q -- '--- SKIP' schedstate-test.log; then
            echo "::error::scheduler run-state tests SKIPPED in the Postgres Backend job."
            grep -- '--- SKIP' schedstate-test.log
            exit 1
          fi
          echo "OK: scheduler run-state backends ran against PostgreSQL with no skips."

      # The step above covers the STORE under -tags postgres. Nothing covered
      # the WIRING: `internal/appbuild` and `internal/cli` were compiled with
      # the tag but never run with it, so every build-agnostic composition-root
      # test in them (Services fully populated, Close idempotent, acl.yaml
      # loaded, corrupt CalDAV cache non-fatal) silently regressed on the
      # postgres build and stayed invisible until someone ran the tagged suite
      # by hand.
      #
      # These are not backend tests — they assert wiring that must hold on
      # every backend — so they run against the same database rather than
      # being excluded. backendtest gives each one a private migrated schema.
      #
      # Skips are tolerated here, unlike the pgstore step: a few cases
      # deliberately assert boot failures that occur before any store opens and
      # legitimately need no database. RELA_TEST_DATABASE_REQUIRED (job env)
      # still turns a MISSING DSN into a hard failure, which is the regression
      # that actually matters.
      #
      # internal/cli and internal/dataentry are scoped with -run rather than run
      # whole. Both hold tests that shell out through internal/cmdexec, which
      # fails closed without a working sandbox — and bubblewrap cannot set up its
      # loopback device on this job's runner ("RTM_NEWADDR: Operation not
      # permitted"), even with the package installed, unlike the `test` job.
      # Those tests are backend-independent and already covered there; running
      # them here would gate the postgres wiring on an unrelated sandbox
      # capability. The `test` job remains the owner of full-package coverage.
      #
      # THE LIST BELOW MUST COVER EVERY PACKAGE WITH A postgres-TAGGED FILE.
      # That is the rule this step exists to enforce: the original defect
      # (BUG-3KQW7P) was tag coverage scoped to the package that motivated the
      # tag (the store) rather than to everything the tag changes, so tagged code
      # elsewhere compiled on every PR and never ran. Find the current set with:
      #
      #   grep -rl '^//go:build postgres' --include='*.go' internal/ cmd/ \
      #     | xargs -n1 dirname | sort -u
      #
      # internal/dataentry earns its place: store_bridge_postgres_test.go holds
      # TestStoreEventBridgeCrossProcessSSE, the ONLY end-to-end proof that a
      # write in one process reaches another's SSE feed over LISTEN/NOTIFY —
      # TKT-WZYWM9's headline feature, and the path TKT-9TOEBH changed the wire
      # format of. Verified non-vacuous: with remote emission disabled it fails.
      - name: Run composition-root wiring tests against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -tags postgres ./internal/appbuild/...
          go test -race -tags postgres -run 'TestNewMCPServices|TestMCPServices|TestMCPWatcher' \
            ./internal/cli/
          go test -race -tags postgres -run 'TestStoreEventBridge' ./internal/dataentry/
          go test -race -tags postgres ./internal/docscli/
          # Write concurrency without a process-wide lock (TKT-WE0S2K): the
          # manager's check-then-writes and webhook appends, raced within one
          # process and across two stores on one schema.
          go test -race -tags postgres -run 'TestConcurrency_' ./internal/entitymanager/
          go test -race -tags postgres -run 'TestWebhookConflict' ./internal/dataentry/

  # Cross-compile every (GOOS, build-tag) combination GoReleaser ships so a
  # platform-specific compile break (e.g. a unix-only syscall used without a
  # build-tagged fallback) fails here at PR time instead of silently at
  # release time, where it leaves an empty GitHub release. The default-runner
  # builds in `postgres` only exercise linux; this job adds darwin + windows.
  # Keep the goos/tag matrix in sync with .goreleaser.yaml's builds.
  # Compiling a build tag is not testing it. Until BUG-LL3C07 the Backends job
  # built the sqlite tag and nothing ever ran a sqlite-tagged test, so
  # sqlitestore's conformance suite (storetest.RunAll plus its fuzz functions),
  # its migration ladder and every `-tags sqlite` variant of a shared package
  # were ungated on every PR. A test whose fixture only works on fsstore had
  # been failing on develop, and nothing looked.
  #
  # Its OWN job, deliberately, rather than a step in the postgres one. That job
  # sets RELA_TEST_DATABASE_REQUIRED=1 so a missing DSN hard-fails instead of
  # skipping — exactly right for proving backend parity, and exactly wrong
  # here: the sqlite build has no DSN, so every DB-gated pgstore test that
  # would otherwise skip fails instead. Running here also keeps this off the
  # critical path of a job that waits on a postgres service container.
  sqlite:
    name: SQLite Backend
    # 26.04, not ubuntu-latest — the same reason the Test job pins it: the
    # command sandbox needs unprivileged user namespaces, which 24.04 restricts
    # via AppArmor (apparmor_restrict_unprivileged_userns=1, surfacing as
    # bwrap "Failed RTM_NEWADDR: Operation not permitted"). internal/cli is in
    # scope and its render tests run confined, so they fail on 24.04 even with
    # bubblewrap installed.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-sqlite-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-sqlite-${{ runner.arch }}-ubuntu-26.04-${{ steps.setup-go.outputs.go-version }}-

      # internal/cli is in scope and its render/export tests shell out through
      # internal/cmdexec, which FAILS CLOSED when no sandbox is available — so
      # without bwrap they do not skip, they fail ("cmdexec: start bwrap:
      # executable file not found"). The Test job installs it for the same
      # reason; a job running the same packages needs the same runner.
      # bubblewrap for the command sandbox; GTK4 + WebKitGTK because
      # `go test -tags sqlite ./...` includes cmd/rela-desktop, which links
      # Wails v3.
      - name: Install bubblewrap (command sandbox) and Wails deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify the sandbox actually works on this runner
        # A hard failure here beats a confusing test failure downstream: it
        # says "the confinement is absent" rather than "render produced the
        # wrong bytes".
        run: bwrap --unshare-all --ro-bind / / /bin/true

      # Scoped to the packages the tag actually changes rather than ./... — the
      # rest is byte-identical to what the Test job already ran, and paying for
      # a second full suite to re-verify it is not worth the minutes.
      #
      # internal/sqlitedb is in the list even though it carries no build tag:
      # it owns the database file and the migration ladder, so its tests are
      # the ones that fail when a schema step is wrong. It is only reached by
      # the sqlite build, which is what makes this the job that should run it.
      #
      # No -race: the Test job races these same shared packages on the default
      # backend, and sqlitestore's own concurrency is covered by the
      # conformance suite. Add it if this job ever grows a genuinely
      # sqlite-specific concurrency test.
      - name: Run sqlite-tagged tests
        run: |
          go test -tags sqlite -shuffle=on \
            ./internal/store/... \
            ./internal/sqlitedb/... \
            ./internal/appbuild/... \
            ./internal/dataentry/... \
            ./internal/cli/...
          # The manager's write-concurrency tests race goroutines on purpose
          # (TKT-WE0S2K), so they run with -race here too.
          go test -race -tags sqlite -run 'TestConcurrency_' ./internal/entitymanager/

  cross-compile:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.tags || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        tags: ["", "postgres"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-cross-compile-${{ matrix.goos }}-${{ matrix.tags || 'default' }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cross-compile-${{ matrix.goos }}-${{ matrix.tags || 'default' }}-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      # CGO off matches the GoReleaser builds for rela / rela-server; this is a
      # pure cross-compile, so no per-OS C toolchain is needed.
      - name: Build rela + rela-server + rela-docs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          flags=""
          [ -n "$BUILD_TAGS" ] && flags="-tags $BUILD_TAGS"
          echo "Building GOOS=$GOOS ${flags:-(default)}"
          go build $flags ./cmd/rela ./cmd/rela-server ./cmd/rela-docs

  # There is deliberately no `build` job: it compiled a strict subset of
  # Cross-Compile (linux/default), but `needs: [build]` on demos/docs made that
  # redundant compile the hinge of a three-stage serial tail. If you
  # reintroduce a compile-only gate here, do not put anything in its `needs:`.
  rela-tickets:
    name: Rela Tickets
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the ticket gate applies
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Two independent switches:
          #   applies      — run the ticket gate at all (validation + done-check).
          #   require_new  — additionally require this PR to add/modify a ticket.
          #
          # dependabot PRs are fully exempt (bot dependency bumps carry no ticket).
          # chore/* PRs are NOT exempt from validation anymore: they still get the
          # `validate` + done-check steps (this is the hole TKT-QXHFJZ slipped
          # through — a chore branch merged a stale `ready` ticket). They are only
          # exempt from the "must reference a ticket" requirement, since a pure
          # chore may legitimately touch no ticket.
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "merge_group" ]]; then
            # Post-merge safety net, and the merge-queue check.
            #
            # push: the PR-time gate can only see the PR's own diff, so a rule
            # that starts failing because of what ALREADY landed (or because a
            # rule/entity elsewhere changed) reaches develop unnoticed and then
            # fails the next unrelated PR. Validating on push pins the blame to
            # the merge that actually broke it.
            #
            # merge_group: this is the last gate before the commit lands, run
            # against the queued combination rather than the PR in isolation —
            # exactly where a cross-PR ticket conflict shows up. Reporting a
            # hollow success here would make the queue's guarantee worthless.
            #
            # Neither has a ticket to add, so `require_new` stays false.
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME on ${GITHUB_REF_NAME:-?}: validating tickets."
          elif [[ "$EVENT_NAME" != "pull_request" ]] \
             || [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "Ticket gate does not apply for $EVENT_NAME / $HEAD_REF; reporting success."
          elif [[ "$HEAD_REF" == chore/* ]]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "chore/* branch: validating tickets but not requiring a new/modified ticket."
          else
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.applies == 'true'
        with:
          fetch-depth: 0

      - name: Set up Go
        if: steps.gate.outputs.applies == 'true'
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        # Gated like the checkout above. Without it, an ungated run has no
        # workspace, so hashFiles() returns "" rather than failing, and the key
        # collapses to exactly the restore-keys prefix — saving a cache built
        # from an empty checkout under the very key every later run falls back
        # to.
        if: steps.gate.outputs.applies == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-rela-tickets-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-rela-tickets-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Build rela
        if: steps.gate.outputs.applies == 'true'
        run: go build -o bin/rela ./cmd/rela

      - name: Check for new or modified work-item entity
        if: steps.gate.outputs.require_new == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Get list of added or modified entity files in this PR
          # A = Added (new tickets), M = Modified (continuation work on existing tickets)
          #
          # Any work-item entity counts, not just bugs/features/tickets: flipping a
          # review-response to `addressed` or closing out a doc-task is exactly the
          # ticket hygiene this gate wants, and failing it for touching the "wrong"
          # entity subdirectory taught people to bolt a no-op ticket edit onto the PR.
          # Reference material (concepts, decisions, ideas, guides) is deliberately
          # NOT here — editing a concept is not evidence of tracked work.
          CHANGED_ENTITIES=$(git diff --name-only --diff-filter=AM "${BASE_SHA}"...HEAD -- \
            'tickets/entities/bugs/*.md' \
            'tickets/entities/features/*.md' \
            'tickets/entities/tickets/*.md' \
            'tickets/entities/researchs/*.md' \
            'tickets/entities/review-responses/*.md' \
            'tickets/entities/doc-tasks/*.md' \
            'tickets/entities/bug-analysis-checklists/*.md' \
            'tickets/entities/implementation-checklists/*.md' \
            'tickets/entities/planning-checklists/*.md' \
            'tickets/entities/review-checklists/*.md' \
            'tickets/entities/docs-checklists/*.md' || true)

          # A code-only PR may carry its tickets on a companion branch (so the code
          # PR is reviewable as code, and the ticket PR merges when the work actually
          # reaches a terminal state). Such a PR declares the companion explicitly.
          TICKETS_PR=""
          if [[ -n "${PR_BODY:-}" ]]; then
            TICKETS_PR=$(printf '%s' "$PR_BODY" \
              | grep -oiE 'Tickets-PR:[[:space:]]*#?[0-9]+' \
              | head -1 | grep -oE '[0-9]+' || true)
          fi

          if [[ -z "$CHANGED_ENTITIES" && -n "$TICKETS_PR" ]]; then
            echo "No work-item entity in this PR, but it declares its tickets live in #${TICKETS_PR}."
            echo "Ticket state is gated on that PR; this one is code-only."
            exit 0
          fi

          if [[ -z "$CHANGED_ENTITIES" ]]; then
            echo ""
            echo "ERROR: PR must include a new or modified work-item entity in tickets/entities/"
            echo ""
            echo "Create one with:"
            echo "  rela create bug --project tickets -P title='Title'"
            echo "  rela create feature --project tickets -P title='Title'"
            echo "  rela create ticket --project tickets -P title='Title'"
            echo ""
            echo "Or, if this PR is code-only and its tickets live on a companion"
            echo "branch, add a line to the PR body:"
            echo "  Tickets-PR: #1234"
            exit 1
          fi

          echo "Found work-item entities:"
          echo "$CHANGED_ENTITIES"

      - name: Entities all parse
        if: steps.gate.outputs.applies == 'true'
        run: |
          set -euo pipefail
          cd tickets

          # An entity whose frontmatter does not parse is SKIPPED by the store
          # rather than failing it: the loader logs the error and carries on, so
          # `rela validate` then happily reports success over a graph that is
          # quietly missing entities. That is not hypothetical — it is how the
          # 10 violations this guard was written for reached develop (#1338
          # logged the warning and passed). Every workflow gate is only as
          # strong as the parser feeding it, so fail loudly on any parse error
          # before trusting a single validation result.
          echo "Checking every entity parses..."
          if ! err=$(../bin/rela list 2>&1 >/dev/null); then
            echo "$err"
            echo ""
            echo "ERROR: rela could not list entities."
            exit 1
          fi

          if printf '%s' "$err" | grep -q "failed to parse frontmatter"; then
            echo "$err"
            echo ""
            echo "ERROR: some entities have unparseable frontmatter."
            echo ""
            echo "These entities are SILENTLY SKIPPED by validation, so the"
            echo "checks below would pass while not actually checking them."
            echo "Fix the YAML before relying on any validation result."
            echo ""
            echo "Most common cause: an unquoted scalar containing ': ' or"
            echo "starting with a character YAML treats specially. Quote it:"
            echo "  title: 'Something: with a colon'"
            exit 1
          fi

          echo "✓ All entities parse."

      - name: Run rela validate
        if: steps.gate.outputs.applies == 'true'
        run: |
          set -euo pipefail
          cd tickets

          echo "Running validation checks..."
          ../bin/rela validate --check cardinality --check properties --check validations

          echo ""
          echo "All rela checks passed!"

      # PR-only: it diffs against the PR base to find what THIS PR touched.
      # On push that base does not exist, and the question is meaningless
      # anyway — the merge already happened.
      - name: Ticket done-before-merge check
        if: steps.gate.outputs.applies == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Any ticket/bug touched by this PR must be brought to a terminal
          # state (done / wont-fix), not left mid-flight or parked in `ready`.
          # The `ci-no-*` validation rules already block planning / in-progress
          # / review / analyzing / blocked; this catches the remaining hole: a
          # work item left in `ready` while its code merges (how TKT-QXHFJZ
          # shipped stale). backlog is allowed (untouched work).
          #
          # `blocked` is NOT accepted here, deliberately. It reads like a
          # terminal state and the previous version of this list accepted it,
          # but ci-no-blocked-tickets / ci-no-blocked-bugs are `severity:
          # error`, so a blocked item failed validation in the same CI run that
          # this gate waved it through. The two gates disagreed; they now
          # agree, in the direction those rules state ("resolve or revert").
          # A ticket genuinely parked on an external dependency stays in the
          # repo at `blocked` — nothing stops that. What is refused is merging
          # a PR that LEAVES its own work item blocked.
          CHANGED=$(git diff --name-only --diff-filter=AM "${BASE_SHA}"...HEAD -- \
            'tickets/entities/bugs/*.md' \
            'tickets/entities/tickets/*.md' || true)

          # Read a frontmatter scalar: only scan between the first two `---`
          # fences so a `status:`/`id:` mention in the markdown body can't be
          # picked up.
          fm_field() {
            awk -v key="$2" '
              /^---[[:space:]]*$/ { fence++; if (fence == 2) exit; next }
              fence == 1 && $0 ~ "^" key ":" {
                sub("^" key ":[[:space:]]*", ""); gsub(/["\x27]/, "");
                print; exit
              }' "$1"
          }

          FAIL=0
          for f in $CHANGED; do
            [[ -f "$f" ]] || continue
            STATUS=$(fm_field "$f" status)
            ID=$(fm_field "$f" id)
            case "$STATUS" in
              done|wont-fix|backlog) ;;
              ready)
                echo "ERROR: $ID is '$STATUS' — finish it (status=done) before merging its PR, or move it back to backlog."
                FAIL=1
                ;;
              blocked)
                # Also caught by ci-no-blocked-{tickets,bugs}; named here so the
                # failure says what to do instead of "not a terminal state".
                echo "ERROR: $ID is 'blocked' — resolve the blocker and finish it (status=done), or move it back to backlog."
                echo "  A ticket may STAY blocked in the repo; what is refused is merging a PR that leaves its own work item blocked."
                FAIL=1
                ;;
              *)
                # planning/in-progress/review/analyzing are caught by ci-no-* rules;
                # flag here too for a clear message.
                echo "ERROR: $ID is '$STATUS' — not a mergeable terminal state."
                FAIL=1
                ;;
            esac
          done
          exit $FAIL

  demos:
    name: Demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-demos-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-demos-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      # graphviz for the demo scripts. GTK4 + WebKitGTK because the tagged-build
      # guard vets `./...`, which includes cmd/rela-desktop (Wails v3); without
      # the headers those cgo packages fail pkg-config and the guard reports a
      # compile failure that is really a missing dependency.
      - name: Install graphviz and Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build rela
        run: go build -o bin/rela ./cmd/rela

      - name: Run demo scripts
        run: |
          set -euo pipefail
          # Skyward demos chain off setup; run it first if present.
          if [ -x scripts/setup-skyward-demo.sh ]; then
            echo "==> scripts/setup-skyward-demo.sh"
            scripts/setup-skyward-demo.sh
          fi
          shopt -s nullglob
          for demo in scripts/demo-*.sh; do
            echo ""
            echo "==> ${demo}"
            "${demo}"
          done

      - name: Run shell-level e2e tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for e2e in scripts/e2e-*.sh; do
            echo ""
            echo "==> ${e2e}"
            "${e2e}"
          done

      # The guard's own test runs FIRST. It is what proves the guard can fail:
      # a parser bug that made the guard pass everything would otherwise report
      # green here and nobody would look further.
      - name: Test the tagged-build guard
        run: ./scripts/check-tagged-tests-test.sh

      # Build-tag-gated files are compiled by nothing else: `go build ./...`
      # skips _test.go entirely, and neither it nor `go test ./...` builds
      # files whose constraints the default tag set does not satisfy. So they
      # rot silently — internal/dataentry/e2e_test.go did exactly that
      # (TKT-1CH5AX). They need Postgres, a browser, or a human reading
      # narrated output, so CI compiles them rather than runs them. The tag
      # list is derived from the source, so a new tag is covered without
      # editing this file.
      - name: Compile build-tag-gated files
        run: ./scripts/check-tagged-tests.sh

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.26.6'
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-docs-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-docs-${{ runner.arch }}-ubuntu-latest-${{ steps.setup-go.outputs.go-version }}-

      - name: Build rela
        run: go build -o bin/rela ./cmd/rela

      - name: Generate docs
        run: ./scripts/generate-docs.sh

      - name: Check docs are up to date
        run: |
          git diff --exit-code docs/ README.md || \
            (echo "" && \
             echo "ERROR: docs/ or README.md is out of date with docs-project/ entities." && \
             echo "Run 'just docs' locally and commit the changes." && \
             echo "" && \
             echo "Changed files:" && \
             git diff --name-only docs/ README.md && \
             exit 1)
