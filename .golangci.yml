version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - intrange
    - lll
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        no-stdlib-log:
          list-mode: lax
          files:
            - '!**/internal/mcp/server.go'
          allow:
            - log/slog
          deny:
            - pkg: log
              desc: use log/slog instead of stdlib log; the stdlib log package is global mutable state with no levels and races with parallel tests
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 60
      ignore-comments: true
    gocognit:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - whyNoLint
        - hugeParam
        - sprintfQuotedString
        - octalLiteral
        # `entity` shadowing the entity package is idiomatic across 40+ sites;
        # stdlib shadows (e.g. `context`) should be caught by reviewers in PR.
        - importShadow
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    gocyclo:
      min-complexity: 35
    godot:
      scope: toplevel
      capital: true
    gosec:
      excludes:
        - G104
        - G204
        - G304
        - G306
        # Remaining taint-analysis checks (gosec v2). These are the Go half of
        # this project's static security analysis; Semgrep covers frontend/
        # (see the `semgrep` job in ci.yml and .semgrep/frontend-xss.yml).
        #
        # The exclusions below surface hardening work
        # that belongs in FEAT-ESLP (data-entry server hardening). Deferring
        # these so the v2 migration doesn't block on threat-model decisions;
        # track the work under that feature instead.
        #
        # G702 is ENABLED: every external-command site has been reviewed and
        # is either argv-array (no shell) or a shell snippet that comes from
        # the operator-authored data-entry.yaml rather than request input.
        # The reviewed exceptions carry narrow, per-line `#nosec G702`
        # comments naming their trust boundary — see internal/dataentry
        # commands.go and document.go. Keep it enabled: it is what catches a
        # new exec site that splices request data into a shell.
        #
        # G703 (path traversal) is ENABLED: its findings are resolved, and the
        # remaining safe-by-design write sites carry narrow `#nosec G703`
        # annotations naming their trust boundary. Do not re-add it here — a
        # new G703 finding is a real path-containment question.
        #
        # G704 (SSRF) is ENABLED: its two findings were reviewed and are
        # operator-configured destinations (.rela/ai.yaml base_url; the
        # `rela sync --remote` flag), annotated with narrow nolint
        # directives naming the trust boundary at each call site.
        #
        # G705 (XSS) is ENABLED: the data-entry HTML/feed sinks were audited
        # and fixed — the entity-help fragment now renders through
        # html/template (contextual auto-escaping) instead of fmt.Fprintf,
        # and the calendar feeds serve escaped non-HTML bodies under nosniff.
        # Remaining G705 sites carry a narrow #nosec with the reason.
        #
        # G706 (log injection) is ENABLED — it is enforced everywhere except
        # internal/dataentry, which is excluded by path below with a pinned
        # structural invariant. See that exclusion for the rationale.
      config:
        global:
          audit: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - rela
        - analyses
        - cancelled
        - eles
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "0644"
        - "0755"
        - "0o644"
        - "0o755"
      ignored-functions:
        - strings.SplitN
        - make
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 6
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    unparam:
      check-exported: false
    unused:
      field-writes-are-uses: true
      post-statements-are-reads: true
      exported-fields-are-used: true
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true
    whitespace:
      multi-if: true
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - forcetypeassert
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - lll
          - mnd
          - noctx
          - prealloc
        path: _test\.go
      - linters:
          - usetesting
        path: internal/testutil/.*\.go
      # internal/perfseed is a data generator: its body IS tuning constants
      # (counts per type, date spans, body sizes, edge fan-out) and a seeded
      # math/rand PRNG is the whole point — determinism, not secrecy. Naming
      # every literal would bury the shape of the graph under fifty consts,
      # and G404 has no security meaning for synthetic demo data.
      - linters:
          - mnd
        path: internal/perfseed/
      - linters:
          - gosec
        path: internal/perfseed/
        text: G404
      # G706 (log injection) in internal/dataentry: false positives.
      #
      # gosec's taint analysis treats slog.Info/Warn/Error/Debug as a sink and
      # flags any request-derived value reaching one, without distinguishing the
      # log MESSAGE from a structured ATTRIBUTE, and without following the value
      # into the handler that encodes it. Injection requires an attacker newline
      # to reach the output unescaped; neither is possible here:
      #
      #   1. Every slog message in the package is a compile-time constant —
      #      user data travels only as a key/value attribute. Enforced by
      #      TestSlogMessagesAreConstant (internal/dataentry/loginjection_test.go),
      #      which fails the build on a dynamic message.
      #   2. Attribute values are escaped by slog.NewTextHandler, installed at
      #      every entry point (internal/cli/kong.go, cmd/rela-server,
      #      cmd/rela-desktop). It quotes values containing control characters
      #      via strconv.Quote — which gosec itself accepts as a G706 sanitizer,
      #      but cannot see through the handler indirection. Pinned by
      #      TestSlogTextHandlerEscapesNewlines.
      #
      # This is a path exclusion rather than ~20 //nosec comments so the
      # reasoning lives in one place and the guarantee is tested, not asserted.
      # If either test fails, fix the log call — do not widen this exclusion.
      - linters:
          - gosec
        path: internal/dataentry/
        text: G706
      # contextcheck in internal/dataentry write handlers: false positives from
      # the provision re-stamp seam (TKT-ANUJDS).
      #
      # The write handlers re-stamp the request context via withProvision:
      # `r = h.withProvision(r)`, where the new context is derived from
      # r.Context() (principal.With + acl.WithRequest + withReadGate — all
      # context.WithValue). The context MUST ride on r, not just thread to the
      # manager, because the downstream read gate is consulted through helpers
      # (h.gateRead, the serializer/reader) that read r.Context() internally; a
      # bare threaded context would leave those reads on the stale unmatched
      # principal and redact the just-provisioned entity from its own response.
      #
      # contextcheck flags every r.Context() after the reassignment as
      # "non-inherited" — it cannot trace the derivation through the *http.Request
      # swap — and propagates that up to the dispatchers that call these handlers
      # (api_v1.go, sync.go). The seam is pinned structurally by
      # TestProvisionSeam_EveryWriteHandlerUsesWithProvision and end-to-end by the
      # provision e2e tests, so the guarantee is tested, not asserted. Path
      # exclusion rather than ~15 //nolint comments so the reasoning lives in one
      # place. If those tests fail, fix the seam — do not widen this exclusion.
      #
      # Two scopes: the write-handler files (where the reassignment happens) are
      # path-excluded; the dispatchers/tests that call them are message-scoped to
      # the specific withProvision handlers so the rest of those files stays checked.
      - linters:
          - contextcheck
        path: internal/dataentry/(write_handler|actions|sync_handler|sync_handlers|attachment_handler|handlers_attachment)\.go
      - linters:
          - contextcheck
        path: internal/dataentry/(api_v1|sync|acl_write_test|handlers_attachment_write_test)\.go
        text: handleV1(CreateEntity|UpdateEntity|DeleteEntity|CreateRelation|UpdateRelation|DeleteRelation|CloneEntity|Action|ConflictResolve|PutAttachment|DeleteAttachment)|handleSyncDelete|handleSyncPut
      - linters:
          - contextcheck
        path: internal/dataentry/comments_handler\.go
        text: commentAccept
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - lll
          - mnd
          - prealloc
          - revive
          - testifylint
          - thelper
          - unused
        path: internal/store/storetest/
      - linters:
          - lll
        source: ^//|`.*`|".*"
      - path: _test\.go
        text: 'mnd:'
      - path: _test\.go
        text: dot-imports
      - path: internal/cli/.*\.go
        text: unused-parameter.*(cmd|args)
      - linters:
          - funlen
          - gocognit
        path: internal/search/searchparser/.*\.go
      - linters:
          - nilerr
          - unparam
        path: internal/mcp/tools_.*\.go
      - linters:
          - gocritic
        text: evalOrder
      - linters:
          - gocritic
        text: rangeValCopy
      - linters:
          - funlen
        path: internal/metamodel/loader\.go
        text: DefaultMetamodelYAML
      - linters:
          - gocognit
        path: internal/metamodel/validation\.go
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - vendor
      - third_party
      - testdata
      - legacy-reference
      - prototypes
      - node_modules
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Sourcehaven-BV/rela
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - legacy-reference
      - prototypes
      - node_modules
      - third_party$
      - builtin$
      - examples$
