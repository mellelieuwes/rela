# go-test-coverage configuration
# https://github.com/vladopajic/go-test-coverage
#
# Coverage is enforced as floor thresholds per package (and a project total).
# Packages may rise or fall freely within their band — no per-file ratchet.
# See CLAUDE.md "Test Coverage" for rationale.

profile: coverage.out

# Minimum coverage thresholds (floor — packages must not drop below these)
#
# The default package floor (50) is what catches "new untested package
# added" — the stated purpose of floors. Packages legitimately below it
# get an explicit override (~5pp below current, the file's convention)
# so the gap stays visible instead of silently unenforced.
threshold:
  file: 0
  package: 50
  total: 65

# Per-package minimum thresholds.
# Set ~5pp below current measured coverage to give refactor headroom.
override:
  # Security-critical: the read-side ACL seam must not silently lose its
  # tests — pinned well above the default floor (RR-L3UQL4).
  - path: ^internal/visibility$
    threshold: 85

  # Security-adjacent for the same reason: the sole compiler for the world
  # resolution that decides which face of an entity is published, and the only
  # place the pointer grammar is enforced (TKT-WAV8XP).
  - path: ^internal/worlds$
    threshold: 85
  # Outbound mail (TKT-332QZY). Both are security-relevant — mailrender is
  # the sanitize/inline pipeline whose ORDER is a security property, and mail
  # owns header-injection validation — so they are pinned above the default
  # floor rather than left to it.
  - path: ^internal/mailrender$
    threshold: 85
  - path: ^internal/mail$
    threshold: 85

  # Below the default floor — explicit lower floors so the gap is
  # visible. Raise these as tests are added; don't lower without reason.
  - path: ^internal/git$
    threshold: 30
  # The seam and its memory backend are well covered; the postgres backend is
  # build-tagged and only compiles under -tags postgres, so it reads as
  # uncovered in the default run — same situation as pgstore.
  - path: ^internal/jobs$
    threshold: 75
  - path: ^internal/cli$
    threshold: 30
  - path: ^internal/search$
    threshold: 20 # the Searcher facade; most logic lives in search/bleveindex and the backends
  - path: ^internal/docscapture$
    threshold: 25 # the browser-capture harness: its core (capture.go/browser.go chromedp orchestration + standUp) only runs under tests that need BOTH a Chrome binary AND a built SPA — both absent in the standard CI matrix, so those tests skip. The non-browser units (annotate/anchor/roleAssignee/copyProjectSchema/padAndClamp/formURL) cover ~26% there; the browser-gated job (Chrome + built SPA) exercises the rest.
  # Close to the default floor — explicit so proximity is documented,
  # not discovered by a surprise CI failure (currently ~56%).
  - path: ^internal/mcp$
    threshold: 50
  - path: ^internal/config$
    threshold: 87
  - path: ^internal/entity$
    threshold: 80
  - path: ^internal/errors$
    threshold: 95
  - path: ^internal/output$
    threshold: 90
  - path: ^internal/project$
    threshold: 80
  - path: ^internal/markdown$
    threshold: 85
  - path: ^internal/filter$
    threshold: 85
  - path: ^internal/metamodel$
    threshold: 65
  - path: ^internal/importer$
    threshold: 65
  - path: ^internal/dataentry$
    threshold: 55
  - path: ^internal/dataentryconfig$
    threshold: 70
  - path: ^internal/lua$
    threshold: 80
  - path: ^internal/imgproc$
    threshold: 78 # native image decode/orient/re-encode; security-critical, keep well-covered

# Exclude packages that are not meaningful to coverage-check
exclude:
  paths:
    - ^cmd/rela                # main entry point
    - ^internal/testutil       # test helpers
    - ^internal/store/storetest # shared conformance test kit (exercised via backends)
    - ^internal/visibility/visibilitytest # shared conformance test kit (exercised via visibility + future wirings)
    - ^internal/state/statetest # shared conformance test kit (exercised via FSKV + pgstore's StateKV)
    - ^internal/lock/locktest # shared conformance test kit (exercised via MemoryLocker + pgstore's keyed lock)
    - ^internal/jobs/jobstest # shared conformance test kit (exercised via the memory + postgres queues)
    - ^internal/mail/mailtest # shared conformance test kit (exercised via the smtp + memory transports)
    - ^internal/schedulerstate/schedulerstatetest # shared conformance test kit (exercised via scheduler-state backends)
    - ^internal/userstate/userstatetest # shared conformance test kit (exercised via mem/kv/pgstore backends)
    - ^internal/comments/commentstest # shared conformance test kit (exercised via the file + memory backends)
    - ^internal/twins/twinstest # shared conformance test kit (exercised via the file + memory backends)
    - ^internal/datamigration/migstatetest # shared conformance test kit (exercised via the file/memory/sqlite/pg backends)
    - ^internal/appbuild/backendtest # build-tagged test backend supplier; the postgres half only compiles under -tags postgres
    - ^internal/store/pgstore  # covered by the dedicated postgres CI job (needs a live DB; skipped without RELA_TEST_DATABASE_URL)
    - ^internal/comments/pgcomments # same live-DB gate as pgstore: reads 3% when the suite skips, ~76% in the postgres CI job
    - ^internal/datamigration/pgmigstate # same live-DB gate as pgstore: reads 8% when the suite skips, ~77% in the postgres CI job
    - ^internal/schedulerstate/pgschedstate # same live-DB gate as pgstore: reads 1% when the suite skips, ~83% with a live DB
    - ^internal/entitymanager/entitymanagertest # shared test doubles (PanicOnUse etc.), exercised via consumers
    - ^internal/store/graphquerynaive # exercised through every backend's graphquery tests; cross-package coverage isn't attributed without -coverpkg, so its own number reads 0
    - ^internal/dataentryconfig/icondefs # the canonical icon table: data plus two accessors, exercised from cmd/gen-icons and dataentryconfig; same cross-package attribution gap as graphquerynaive, so its own number reads 0
    - ^frontend/node_modules   # Go files in npm dependencies
    - ^e2e/node_modules        # Go files in npm dependencies (e.g. flatted)

# Require coverage-ignore annotations to have explanatory comments
force-annotation-comment: true
